task_id: e2e-migration-p1
plan_key: P1
note: Node payloads are executable skeletons; the complete letter-to-letter step bodies live in final/PLAYBOOK.md under the matching STEP heading.
nodes:
- id: STEP-001
  playbook_ref: STEP-001
  title: 'Pin the repository build contract: target framework and package versions'
  todo: P1.T1
  depends_on: []
  critical_path: true
  exact_files:
  - Directory.Build.props
  - Directory.Packages.props
  summary_spec: Directory.Build.props and Directory.Packages.props exist at the repository root, fixing net8.0, C# 12, nullable, implicit usings and warnings-as-errors for every project, and pinning the
    five NuGet versions centrally. No project declares a framework or a package version of its own.
  verification:
    machine:
    - dotnet --version prints 8.0.x
    human:
    - Directory.Build.props contains exactly one PropertyGroup and no ItemGroup.
  acceptance:
  - Both props files exist at the repository root with the pinned content.
  full_detail_in: final/PLAYBOOK.md section STEP-001 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
- id: STEP-002
  playbook_ref: STEP-002
  title: Create the Shared class library and pin the source's timeouts
  todo: P1.T1
  depends_on:
  - STEP-001
  critical_path: true
  exact_files:
  - src/Shared/PiggyMetrics.Shared.csproj
  - src/Shared/PiggyMetricsTimeouts.cs
  summary_spec: 'src/Shared is a net8.0 class library referencing the ASP.NET Core shared framework plus MongoDB.Driver and Microsoft.Extensions.Http, and PiggyMetricsTimeouts exposes the source''s two
    timeouts: 10000 ms for a service call and 20000 ms at the gateway. It builds clean on its own.'
  verification:
    machine:
    - dotnet build src/Shared/PiggyMetrics.Shared.csproj -warnaserror exits 0 with 0 warnings
    human:
    - PiggyMetricsTimeouts.Default reads TimeSpan.FromMilliseconds(10000).
  acceptance:
  - The Shared library builds clean on its own.
  full_detail_in: final/PLAYBOOK.md section STEP-002 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
- id: STEP-003
  playbook_ref: STEP-003
  title: Port the bearer handler that resolves a token against the authorization server
  todo: P1.T2
  depends_on:
  - STEP-002
  critical_path: true
  exact_files:
  - src/Shared/Security/UserInfoAuthenticationOptions.cs
  - src/Shared/Security/PiggyMetricsClaims.cs
  - src/Shared/Security/UserInfoAuthenticationHandler.cs
  summary_spec: Shared carries a bearer authentication handler that resolves a token by calling the configured user-info endpoint, refuses on a non-success status, a transport failure or an error member,
    resolves the principal name through the source's PRINCIPAL_KEYS order, and projects oauth2Request.clientId and every scope entry into claims.
  verification:
    machine:
    - dotnet build src/Shared/PiggyMetrics.Shared.csproj -warnaserror exits 0 with 0 warnings
    human:
    - The handler sends GET to the configured user-info URI with an Authorization header of Bearer plus the inbound token.
  acceptance:
  - A token the source's authorization server issued is accepted and carries the principal name the source would report.
  full_detail_in: final/PLAYBOOK.md section STEP-003 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
- id: STEP-004
  playbook_ref: STEP-004
  title: Register the resource server and the user and server authorization policies
  todo: P1.T2
  depends_on:
  - STEP-003
  critical_path: true
  exact_files:
  - src/Shared/Security/PiggyMetricsPolicies.cs
  - src/Shared/Security/SecurityServiceCollectionExtensions.cs
  summary_spec: 'AddPiggyMetricsResourceServer registers the UserInfoBearer scheme with the user-info client at the source''s timeout, and registers the two policies the downstream plans name: user (authenticated)
    and server (authenticated plus a scope claim of server).'
  verification:
    machine:
    - dotnet build src/Shared/PiggyMetrics.Shared.csproj -warnaserror exits 0 with 0 warnings
    human:
    - PiggyMetricsPolicies.User is the literal user and PiggyMetricsPolicies.Server is the literal server.
  acceptance:
  - A service calling AddPiggyMetricsResourceServer can guard an endpoint with the user policy or the server policy without declaring either itself.
  full_detail_in: final/PLAYBOOK.md section STEP-004 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
- id: STEP-005
  playbook_ref: STEP-005
  title: Port the store conventions and the decimal serializer that match the documents on disk
  todo: P1.T3
  depends_on:
  - STEP-002
  critical_path: true
  exact_files:
  - src/Shared/Persistence/DecimalAsStringSerializer.cs
  - src/Shared/Persistence/MongoConventions.cs
  summary_spec: Shared registers one Mongo convention pack (camel-case elements, ignore extra elements, ignore nulls, enums as names) and a decimal serializer that writes a BSON string and reads string,
    double, int32, int64 and decimal128, so documents the Java services wrote stay readable and writable.
  verification:
    machine:
    - dotnet build src/Shared/PiggyMetrics.Shared.csproj -warnaserror exits 0 with 0 warnings
    human:
    - Serializing a sample item writes amount as a BSON string.
  acceptance:
  - A document the Java account service wrote round-trips through the .NET types without losing a field or changing a BSON type.
  full_detail_in: final/PLAYBOOK.md section STEP-005 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
- id: STEP-006
  playbook_ref: STEP-006
  title: Register the Mongo database handle from the source's connection settings
  todo: P1.T3
  depends_on:
  - STEP-005
  critical_path: true
  exact_files:
  - src/Shared/Persistence/MongoStoreOptions.cs
  - src/Shared/Persistence/PersistenceServiceCollectionExtensions.cs
  summary_spec: AddPiggyMetricsStore binds the source's spring:data:mongodb keys and registers a singleton IMongoClient and IMongoDatabase, authenticating against the configured database the way mongodb/init.sh
    grants readWrite on piggymetrics.
  verification:
    machine:
    - dotnet build src/Shared/PiggyMetrics.Shared.csproj -warnaserror exits 0 with 0 warnings
    human:
    - MongoStoreOptions.SectionName is the literal spring:data:mongodb.
  acceptance:
  - A service configured with the source's mongodb keys resolves an IMongoDatabase pointing at the same database the Java service used.
  full_detail_in: final/PLAYBOOK.md section STEP-006 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
- id: STEP-007
  playbook_ref: STEP-007
  title: Port the client-credentials token cache and the outbound bearer handler
  todo: P1.T4
  depends_on:
  - STEP-002
  critical_path: true
  exact_files:
  - src/Shared/Http/OAuth2ClientOptions.cs
  - src/Shared/Http/ClientCredentialsTokenCache.cs
  - src/Shared/Http/ClientCredentialsHandler.cs
  summary_spec: Shared carries a client-credentials token cache that posts the grant with HTTP Basic client authentication, reuses the token until its expiry instant with no skew, collapses concurrent callers
    into one token request, and a delegating handler that attaches the token as a bearer header.
  verification:
    machine:
    - dotnet build src/Shared/PiggyMetrics.Shared.csproj -warnaserror exits 0 with 0 warnings
    human:
    - Three consecutive token requests against a cache holding a live token produce one outbound call.
  acceptance:
  - A service edge calling a guarded endpoint carries a bearer token the resource servers accept.
  full_detail_in: final/PLAYBOOK.md section STEP-007 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
- id: STEP-008
  playbook_ref: STEP-008
  title: Expose the typed-client base so each edge gets one HTTP client at the source's timeout
  todo: P1.T4
  depends_on:
  - STEP-007
  critical_path: true
  exact_files:
  - src/Shared/Http/HttpServiceCollectionExtensions.cs
  summary_spec: 'Shared exposes three registrations: the client-credentials infrastructure, a token-bearing typed client, and an anonymous typed client for the rates edge. Every client carries the source''s
    10000 ms timeout and an absolute base address.'
  verification:
    machine:
    - dotnet build src/Shared/PiggyMetrics.Shared.csproj -warnaserror exits 0 with 0 warnings
    human:
    - Both client registrations set Timeout to PiggyMetricsTimeouts.Default.
  acceptance:
  - A downstream plan registers its edge with one call and inherits the source's timeout and token behaviour.
  full_detail_in: final/PLAYBOOK.md section STEP-008 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
- id: STEP-009
  playbook_ref: STEP-009
  title: 'Port the JSON options: enum names, ignored unknown fields, epoch-millisecond dates'
  todo: P1.T5
  depends_on:
  - STEP-002
  critical_path: true
  exact_files:
  - src/Shared/Json/EpochMillisecondsDateTimeConverter.cs
  - src/Shared/Json/PiggyMetricsJson.cs
  summary_spec: 'Shared exposes JSON options that reproduce the source''s Jackson shape: camel-case names, enums as names including dictionary keys, unknown members skipped, nulls written, and dates written
    and read as epoch milliseconds.'
  verification:
    machine:
    - dotnet build src/Shared/PiggyMetrics.Shared.csproj -warnaserror exits 0 with 0 warnings
    human:
    - Serializing a sample account whose lastSeen is 2018-06-15T10:30:00Z writes the member lastSeen as 1529058600000.
  acceptance:
  - A response body produced by a ported controller matches the source's body for the same document.
  full_detail_in: final/PLAYBOOK.md section STEP-009 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
- id: STEP-010
  playbook_ref: STEP-010
  title: Port the actuator health endpoint with the source's path, body and status codes
  todo: P1.T5
  depends_on:
  - STEP-002
  critical_path: true
  exact_files:
  - src/Shared/Health/HealthEndpoints.cs
  summary_spec: Shared exposes an actuator health endpoint at /actuator/health under the service context path, anonymous, writing a single status member of UP or DOWN with 200 for healthy or degraded and
    503 for unhealthy.
  verification:
    machine:
    - dotnet build src/Shared/PiggyMetrics.Shared.csproj -warnaserror exits 0 with 0 warnings
    human:
    - A healthy service answers the actuator health path with the body {"status":"UP"} and status 200.
  acceptance:
  - A container healthcheck written against the source's actuator path succeeds against the ported service.
  full_detail_in: final/PLAYBOOK.md section STEP-010 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
- id: STEP-011
  playbook_ref: STEP-011
  title: 'Compose the service defaults: port, context path, resource server, JSON and health'
  todo: P1.T5
  depends_on:
  - STEP-004
  - STEP-009
  - STEP-010
  critical_path: true
  exact_files:
  - src/Shared/Configuration/ServerOptions.cs
  - src/Shared/PiggyMetricsServiceDefaults.cs
  summary_spec: AddPiggyMetricsDefaults and UsePiggyMetricsDefaults bind the listener to server:port, wire controllers with the ported JSON options, the resource server and health, and enforce server:servlet:context-path
    by answering 404 outside the prefix before rebasing onto it.
  verification:
    machine:
    - dotnet build src/Shared/PiggyMetrics.Shared.csproj -warnaserror exits 0 with 0 warnings
    human:
    - Starting the account service and requesting /accounts/actuator/health returns {"status":"UP"}.
  acceptance:
  - Each ported service listens on the source's port and serves only under the source's context path.
  full_detail_in: final/PLAYBOOK.md section STEP-011 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
- id: STEP-012
  playbook_ref: STEP-012
  title: Create the five runtime service projects on the source's ports and context paths
  todo: P1.T1
  depends_on:
  - STEP-011
  critical_path: true
  exact_files:
  - src/Gateway/PiggyMetrics.Gateway.csproj
  - src/Gateway/Program.cs
  - src/Gateway/appsettings.json
  - src/AuthService/PiggyMetrics.AuthService.csproj
  - src/AuthService/Program.cs
  - src/AuthService/appsettings.json
  - src/AccountService/PiggyMetrics.AccountService.csproj
  - src/AccountService/Program.cs
  - src/AccountService/appsettings.json
  - src/StatisticsService/PiggyMetrics.StatisticsService.csproj
  - src/StatisticsService/Program.cs
  - src/StatisticsService/appsettings.json
  - src/NotificationService/PiggyMetrics.NotificationService.csproj
  - src/NotificationService/Program.cs
  - src/NotificationService/appsettings.json
  summary_spec: Five web projects exist under src on the source's ports and context paths (Gateway 4000 root, AuthService 5000 /uaa, AccountService 6000 /accounts, StatisticsService 7000 /statistics, NotificationService
    8000 /notifications), each referencing Shared and calling the Shared defaults, each exposing a public partial Program.
  verification:
    machine:
    - each of the five dotnet build commands exits 0 with 0 warnings
    human:
    - src holds exactly Shared, Gateway, AuthService, AccountService, StatisticsService and NotificationService.
  acceptance:
  - Every runtime service project named by P1.T1 exists and builds.
  full_detail_in: final/PLAYBOOK.md section STEP-012 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
- id: STEP-013
  playbook_ref: STEP-013
  title: Add the Shared test project that proves the plan's done-when clause
  todo: P1.T2
  depends_on:
  - STEP-011
  critical_path: true
  exact_files:
  - tests/PiggyMetrics.Shared.Tests/PiggyMetrics.Shared.Tests.csproj
  - tests/PiggyMetrics.Shared.Tests/StubHttpMessageHandler.cs
  - tests/PiggyMetrics.Shared.Tests/StubHttpClientFactory.cs
  - tests/PiggyMetrics.Shared.Tests/StubOptionsMonitor.cs
  - tests/PiggyMetrics.Shared.Tests/SourceTokenBodies.cs
  - tests/PiggyMetrics.Shared.Tests/UserInfoAuthenticationHandlerTest.cs
  - tests/PiggyMetrics.Shared.Tests/ClientCredentialsTokenCacheTest.cs
  - tests/PiggyMetrics.Shared.Tests/MongoConventionsTest.cs
  - tests/PiggyMetrics.Shared.Tests/PiggyMetricsJsonTest.cs
  - tests/PiggyMetrics.Shared.Tests/HealthEndpointsTest.cs
  summary_spec: tests/PiggyMetrics.Shared.Tests holds three stubs, the source's user-info fixture bodies and five test classes totalling 24 tests that prove the handler accepts and refuses correctly and
    lock the document shape, the token cache behaviour, the wire shape and the health body. The suite reaches no network.
  verification:
    machine:
    - dotnet test tests/PiggyMetrics.Shared.Tests/PiggyMetrics.Shared.Tests.csproj reports Passed with 24 tests and 0 failures
    human:
    - ShouldAuthenticateTokenIssuedByAuthorizationServer and ShouldRejectTokenTheAuthorizationServerDidNotIssue both appear in the run.
  acceptance:
  - 'P1''s done-when clause is demonstrated: the handler accepts a token the source''s authorization server issued and refuses one it did not.'
  full_detail_in: final/PLAYBOOK.md section STEP-013 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
- id: STEP-014
  playbook_ref: STEP-014
  title: Wire the solution and prove every project builds and the suite is green
  todo: P1.T1
  depends_on:
  - STEP-012
  - STEP-013
  critical_path: true
  exact_files:
  - PiggyMetrics.sln
  summary_spec: PiggyMetrics.sln exists at the repository root carrying all seven projects, the whole solution builds with zero warnings under warnings-as-errors, and the whole suite reports 24 passing
    tests.
  verification:
    machine:
    - dotnet build PiggyMetrics.sln -warnaserror exits 0 and prints 0 Warning(s) and 0 Error(s)
    human:
    - dotnet sln PiggyMetrics.sln list shows seven projects.
  acceptance:
  - Every project builds, which is the first half of P1's done-when clause.
  full_detail_in: final/PLAYBOOK.md section STEP-014 (complete invariants, edge cases, do-not, verification and acceptance)
  no_imagination: true
