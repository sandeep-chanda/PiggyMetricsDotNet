decisions:
- id: D-001
  question: One solution with a root-level build contract, generated solution file
  options:
  - Per-project TargetFramework and package versions
  - Root Directory.Build.props plus Directory.Packages.props
  - A hand-written solution file with pinned project identifiers
  decision: Root Directory.Build.props plus Directory.Packages.props, with PiggyMetrics.sln generated
    by the SDK
  rationale: Mirrors the source's single inherited build contract (R-001). The solution file's project
    identifiers are generated values, so pinning them would be fake precision; the two dotnet commands
    that produce it are pinned instead.
  plan_steps:
  - STEP-001
  - STEP-014
  status: accepted
- id: D-002
  question: Target framework
  options:
  - net6.0
  - net8.0
  - net9.0
  decision: net8.0
  rationale: 'The spec says .NET without a version. net8.0 was the current LTS at planning time. Proven:
    the whole reference solution builds and tests green on SDK 8.0.425.'
  plan_steps:
  - STEP-001
  status: accepted
- id: D-003
  question: Service discovery and the config server
  options:
  - Port Eureka and Spring Cloud Config
  - Address services by configured URL
  decision: Address services by configured URL; do not port Eureka or the config server
  rationale: No P1 todo names discovery or a config server, and P1.T1 names five runtime services only
    (R-002). The source's own gateway already addresses auth-service by a fixed URL (R-014), so configured
    addresses are a precedent, not an invention.
  plan_steps:
  - STEP-012
  status: accepted
- id: D-004
  question: Token validation strategy
  options:
  - Validate the token locally as a JWT
  - Resolve the token against the authorization server's user-info endpoint
  decision: Resolve the token against the authorization server's user-info endpoint
  rationale: The source's tokens are opaque and held in an InMemoryTokenStore; every resource server resolves
    them through CustomUserInfoTokenServices (R-004). A local JWT validator would accept and refuse a
    different set of tokens, breaking P1's done-when clause.
  plan_steps:
  - STEP-003
  status: accepted
- id: D-005
  question: Authorization shape
  options:
  - Role claims
  - Two named policies, user and server, with server keyed on the scope claim
  decision: Two named policies, user and server, with server keyed on the scope claim
  rationale: 'The source guards with authenticated() and #oauth2.hasScope(''server''); the downstream
    todos already speak of policy user and policy server. Keying server on the scope claim reproduces
    the source''s 403 for a user token.'
  plan_steps:
  - STEP-004
  status: accepted
- id: D-006
  question: Decimal storage
  options:
  - BSON Decimal128
  - BSON string, reading string and numeric
  decision: BSON string on write; string, double, int32, int64 and decimal128 on read
  rationale: Spring Data MongoDB 2.0.x writes BigDecimal as a String, and the seeded dump holds numeric
    amounts (R-007). Writing Decimal128 would produce documents a still-running Java service could not
    read, and would silently diverge from every existing document.
  plan_steps:
  - STEP-005
  status: accepted
- id: D-007
  question: Document mapping conventions
  options:
  - Attribute every entity individually
  - One registered convention pack in Shared
  decision: 'One registered convention pack in Shared: camel-case elements, ignore extra elements, ignore
    nulls, enums as names'
  rationale: The stored member names are the Java field names and the stored shapes are uniform across
    all four databases (R-006, R-007). A shared pack keeps every downstream entity correct by default
    instead of relying on each plan to remember.
  plan_steps:
  - STEP-005
  - STEP-006
  status: accepted
- id: D-008
  question: Edge client shape
  options:
  - One shared HttpClient
  - One typed client per edge at the source's timeout
  decision: One typed client per edge at the source's 10000 ms timeout, with a token-bearing and an anonymous
    registration
  rationale: P1.T4 asks for an HTTP client per edge, and the source declares one Feign interface per edge
    with the rates edge anonymous (R-003, R-009).
  plan_steps:
  - STEP-007
  - STEP-008
  status: accepted
- id: D-009
  question: Token cache expiry policy
  options:
  - Refresh early with a safety skew
  - Refresh exactly at expiry, as the source does
  decision: Refresh exactly at expiry, as the source does
  rationale: Spring's OAuth2 client context treats a token as usable until its expiry instant and refreshes
    only then. Adding a skew would change the request pattern the authorization server sees and would
    diverge from the behaviour the downstream contract rows replay. The trade-off, a token that expires
    in flight, is the source's trade-off too, and the caller's existing failure path already covers it.
  plan_steps:
  - STEP-007
  status: accepted
- id: D-010
  question: Wire JSON shape
  options:
  - ASP.NET Core defaults
  - Options reproducing Jackson's defaults as the source leaves them
  decision: 'Options reproducing Jackson''s defaults: camel-case names, enum names, unknown members skipped,
    nulls written, dates as epoch milliseconds'
  rationale: The downstream contract rows replay with the source's body, so any divergence is a defect
    (R-010, R-011). No source service overrides Jackson, so the source's shape is Jackson's default shape.
  plan_steps:
  - STEP-009
  status: accepted
- id: D-011
  question: Health endpoint shape
  options:
  - The ASP.NET Core default health response
  - The Boot 2.0 actuator body and path
  decision: 'The Boot 2.0 actuator body and path: /actuator/health under the context path, a single status
    member, 200 for up and 503 for down, anonymous'
  rationale: Container orchestration already probes that path and body (R-012). Changing either would
    break an operational contract that exists outside the code.
  plan_steps:
  - STEP-010
  status: accepted
- id: D-012
  question: Context path semantics
  options:
  - UsePathBase alone
  - A prefix guard in front of UsePathBase
  decision: A prefix guard in front of UsePathBase
  rationale: UsePathBase alone still serves the unprefixed path, which Spring's context-path does not
    (R-013, X-002). Without the guard a downstream contract replay could pass against a URL the source
    answers 404 for.
  plan_steps:
  - STEP-011
  status: accepted
- id: D-013
  question: Proving P1's done-when clause
  options:
  - Leave it to a manual check
  - An xunit suite in the same solution
  decision: An xunit suite in the same solution, with no network and no live Mongo
  rationale: The done-when clause is behavioural. A suite that stubs the user-info endpoint can assert
    acceptance and refusal deterministically, and the same suite locks the document and wire shapes the
    later plans depend on.
  plan_steps:
  - STEP-013
  status: accepted
