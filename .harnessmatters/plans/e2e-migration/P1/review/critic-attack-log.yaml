issues_found_and_fixed_during_planning:
- id: FIX-001
  vector: constraint_risk
  issue: The first reference implementation used UsePathBase alone, so the account service answered 200 on the unprefixed
    /actuator/health, which Spring answers 404 for.
  resolution: 'Root-caused by measuring a running service, then fixed in STEP-011 with a prefix guard in front of UsePathBase
    and re-measured: prefixed 200, unprefixed 404, lookalike prefix 404.'
  soft_patched: false
- id: FIX-002
  vector: reference_trace
  issue: An OAuth2RequestPayload type was written and never referenced once the handler was built on JsonElement.
  resolution: Deleted from the pinned set and the solution rebuilt clean, rather than shipping a type the plan does not use.
  soft_patched: false
- id: FIX-003
  vector: test_gaps
  issue: The token cache test read the request body after the framework had disposed the form content, so the assertion failed
    for a test-harness reason rather than a product reason.
  resolution: The recording stub now captures the body at send time; the suite is green at 24 of 24 without weakening any
    assertion.
  soft_patched: false
