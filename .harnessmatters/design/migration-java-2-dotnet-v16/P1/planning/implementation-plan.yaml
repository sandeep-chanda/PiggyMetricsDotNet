- id: STEP-010
  title: Add the Shared test project and prove the bearer handler accepts and refuses
  todo_refs:
  - P1.T2
  why: The P1 done-when clause is that Shared's bearer handler accepts a token the source's authorization server issued and refuses one it did not. DEC-011 makes that machine-checkable here, because no later plan owns Shared. The stub answers the user-info endpoint the way the source's authorization server does, so the assertions bind to the real contract.
  change: 'Create tests/Shared.Tests/Shared.Tests.csproj referencing Shared, Microsoft.AspNetCore.TestHost, Microsoft.NET.Test.Sdk, xunit and xunit.runner.visualstudio, and tests/Shared.Tests/Security/UserInfoAuthenticationHandlerTests.cs, which stands up a TestServer whose user-info HTTP client is backed by an AuthorizationServerStub returning the serialized OAuth2Authentication for two issued tokens and 401 for anything else, then asserts five outcomes: an issued user token reaches the user policy with 200 and the principal name demo; an unissued token is refused with 401; a request with no token is refused with 401; an issued server-scope token reaches the server policy with 200; an issued ui-scope token is forbidden on the server policy with 403. Add the project to the solution.'
  exact_files:
  - tests/Shared.Tests/Shared.Tests.csproj
  - tests/Shared.Tests/Security/UserInfoAuthenticationHandlerTests.cs
  creates_file: true
  companion_required: false
  existing_implementation: No test project exists in TargetRepo. The source carries no unit test for CustomUserInfoTokenServices, so the assertions derive from its behaviour at lines 68-107 and from the scope vocabulary at auth-service OAuth2AuthorizationConfig.java:43-64. The stub's document follows the Jackson rendering of the OAuth2Authentication that /uaa/users/current returns, of which the handler reads name, oauth2Request.clientId, oauth2Request.scope and authorities.
  exact_snippet: |
