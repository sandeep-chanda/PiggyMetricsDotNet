nodes:
- id: STEP-001
  playbook_ref: STEP-001
  title: Create the repository build configuration the whole solution inherits
  depends_on: []
  critical_path: true
  exact_files:
  - global.json
  - .gitignore
  - Directory.Build.props
  - Directory.Packages.props
  summary_spec: The repository root carries global.json (SDK 10.0.100, rollForward latestMajor), .gitignore, Directory.Build.props (net10.0) and Directory.Packages.props (central package management, five pinned versions). Nothing else declares a framework or a version.
  verification:
    machine:
    - test -f global.json && test -f Directory.Build.props && test -f Directory.Packages.props && test -f .gitignore
  acceptance:
  - The four files exist at the repository root with exactly the pinned bodies.
  no_imagination: true
- id: STEP-002
  playbook_ref: STEP-002
  title: Create the solution and the Shared class library project
  depends_on:
  - STEP-001
  critical_path: true
  exact_files:
  - PiggyMetrics.sln
  - src/Shared/Shared.csproj
  summary_spec: 'PiggyMetrics.sln exists at the root and lists src/Shared/Shared.csproj: a class library, RootNamespace PiggyMetrics.Shared, AssemblyName Shared, FrameworkReference Microsoft.AspNetCore.App, version-less MongoDB.Driver. It restores and builds alone.'
  verification:
    machine:
    - dotnet sln PiggyMetrics.sln list
  acceptance:
  - PiggyMetrics.sln exists at the repository root and lists src/Shared/Shared.csproj.
  no_imagination: true
- id: STEP-003
  playbook_ref: STEP-003
  title: Pin the shared JSON contract and the source's date rendering
  depends_on:
  - STEP-002
  critical_path: false
  exact_files:
  - src/Shared/Json/PiggyMetricsJson.cs
  summary_spec: 'PiggyMetricsJson.cs exists: JacksonDateTimeConverter writes UTC yyyy-MM-dd''T''HH:mm:ss.fff plus the literal +0000 and reads epoch millis and ISO-8601; Configure applies camelCase, case-sensitive matching, skipped unknown members and name-only enums.'
  verification:
    machine:
    - dotnet build src/Shared/Shared.csproj -c Debug
  acceptance:
  - src/Shared/Json/PiggyMetricsJson.cs exists with exactly the pinned body and the Shared project compiles.
  no_imagination: true
- id: STEP-004
  playbook_ref: STEP-004
  title: Pin the store conventions, serializers and collection naming
  depends_on:
  - STEP-002
  critical_path: false
  exact_files:
  - src/Shared/Mongo/MongoConventions.cs
  - src/Shared/Mongo/MongoExtensions.cs
  summary_spec: 'MongoConventions.cs and MongoExtensions.cs exist: decimal as a BSON string, UTC DateTime, camelCase element names, ignore-extra-elements, ignore-if-null, string enums, MongoCollectionAttribute, and MongoStoreOptions whose auth source equals the database.'
  verification:
    machine:
    - dotnet build src/Shared/Shared.csproj -c Debug
  acceptance:
  - Both files exist with exactly the pinned bodies and the Shared project compiles.
  no_imagination: true
- id: STEP-005
  playbook_ref: STEP-005
  title: Pin the bearer handler that resolves a token through the authorization server
  depends_on:
  - STEP-002
  critical_path: true
  exact_files:
  - src/Shared/Security/PiggyMetricsAuth.cs
  - src/Shared/Security/UserInfoAuthenticationHandler.cs
  summary_spec: 'PiggyMetricsAuth.cs and UserInfoAuthenticationHandler.cs exist: the handler resolves the presented token at the user-info endpoint, fails closed on a bad status, a transport error or an error member, and emits the principal name, client id, scope claims and authorities.'
  verification:
    machine:
    - dotnet build src/Shared/Shared.csproj -c Debug
  acceptance:
  - Both files exist with exactly the pinned bodies and the Shared project compiles.
  no_imagination: true
- id: STEP-006
  playbook_ref: STEP-006
  title: Register the bearer scheme and the user and server authorization policies
  depends_on:
  - STEP-005
  critical_path: true
  exact_files:
  - src/Shared/Security/SecurityExtensions.cs
  summary_spec: 'SecurityExtensions.cs exists: AddPiggyMetricsResourceServer registers the user-info HTTP client, the Bearer scheme, the user policy (authenticated) and the server policy (authenticated plus a scope claim whose value is server), with an authenticated default policy.'
  verification:
    machine:
    - dotnet build src/Shared/Shared.csproj -c Debug
  acceptance:
  - src/Shared/Security/SecurityExtensions.cs exists with exactly the pinned body and the Shared project compiles.
  no_imagination: true
- id: STEP-007
  playbook_ref: STEP-007
  title: Pin the typed-client base, the source's timeout and the client-credentials token cache
  depends_on:
  - STEP-002
  critical_path: false
  exact_files:
  - src/Shared/Http/ServiceClients.cs
  - src/Shared/Http/HttpClientExtensions.cs
  summary_spec: 'ServiceClients.cs and HttpClientExtensions.cs exist: the 10000 ms timeout, a client-credentials token provider caching one token per process behind a semaphore until expiry, a bearer-attaching handler, and the token-carrying and token-free client registrations.'
  verification:
    machine:
    - dotnet build src/Shared/Shared.csproj -c Debug
  acceptance:
  - Both files exist with exactly the pinned bodies and the Shared project compiles.
  no_imagination: true
- id: STEP-008
  playbook_ref: STEP-008
  title: Pin the actuator health endpoint and the service default composition
  depends_on:
  - STEP-003
  critical_path: false
  exact_files:
  - src/Shared/Health/HealthExtensions.cs
  - src/Shared/ServiceDefaults.cs
  summary_spec: 'HealthExtensions.cs and ServiceDefaults.cs exist: an anonymous /actuator/health answering 200 UP and 503 DOWN, and the defaults that wire the JSON contract, authentication, authorization, health and controllers behind the configured path base.'
  verification:
    machine:
    - dotnet build src/Shared/Shared.csproj -c Debug
  acceptance:
  - Both files exist with exactly the pinned bodies and the Shared project compiles.
  no_imagination: true
- id: STEP-009
  playbook_ref: STEP-009
  title: Create the five runtime service projects on the shared defaults
  depends_on:
  - STEP-006
  - STEP-008
  critical_path: true
  exact_files:
  - src/Gateway/Gateway.csproj
  - src/Gateway/Program.cs
  - src/Gateway/appsettings.json
  - src/AuthService/AuthService.csproj
  - src/AuthService/Program.cs
  - src/AuthService/appsettings.json
  - src/AccountService/AccountService.csproj
  - src/AccountService/Program.cs
  - src/AccountService/appsettings.json
  - src/StatisticsService/StatisticsService.csproj
  - src/StatisticsService/Program.cs
  - src/StatisticsService/appsettings.json
  - src/NotificationService/NotificationService.csproj
  - src/NotificationService/Program.cs
  - src/NotificationService/appsettings.json
  summary_spec: 'Five web projects with Program.cs and appsettings.json are in the solution: Gateway 4000 health only, AuthService 5000 /uaa without a resource server, AccountService 6000 /accounts, StatisticsService 7000 /statistics, NotificationService 8000 /notifications. All reference Shared.'
  verification:
    machine:
    - dotnet sln PiggyMetrics.sln list
  acceptance:
  - All fifteen files exist with exactly the pinned bodies.
  no_imagination: true
- id: STEP-010
  playbook_ref: STEP-010
  title: Add the Shared test project and prove the bearer handler accepts and refuses
  depends_on:
  - STEP-006
  critical_path: false
  exact_files:
  - tests/Shared.Tests/Shared.Tests.csproj
  - tests/Shared.Tests/Security/UserInfoAuthenticationHandlerTests.cs
  summary_spec: 'tests/Shared.Tests is in the solution and asserts five outcomes against a TestServer stub: accepted issued token, refused unissued token, refused tokenless request, allowed server scope, forbidden ui scope on the server policy.'
  verification:
    machine:
    - dotnet test tests/Shared.Tests/Shared.Tests.csproj -c Debug
  acceptance:
  - Both files exist with exactly the pinned bodies.
  no_imagination: true
- id: STEP-011
  playbook_ref: STEP-011
  title: Gate P1 on a clean solution build and a green test run
  depends_on:
  - STEP-004
  - STEP-007
  - STEP-009
  - STEP-010
  critical_path: true
  exact_files:
  - PiggyMetrics.sln
  summary_spec: One run from the repository root restores, builds and tests PiggyMetrics.sln with zero errors and five passing tests, and one commit names P1.T1 through P1.T5. Both halves of the P1 done-when clause are proven.
  verification:
    machine:
    - dotnet build PiggyMetrics.sln -c Debug --no-restore
  acceptance:
  - dotnet build PiggyMetrics.sln succeeds.
  no_imagination: true
