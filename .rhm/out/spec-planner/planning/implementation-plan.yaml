  change: 'Host AuthService on port 5000 with path base /uaa. Persist users in auth-mongodb database piggymetrics. Register
    four clients: browser with grants refresh_token and password and scope ui; account-service, statistics-service, and notification-service
    with grants client_credentials and refresh_token, scope server, and secrets from ACCOUNT_SERVICE_PASSWORD, STATISTICS_SERVICE_PASSWORD,
    and NOTIFICATION_SERVICE_PASSWORD. POST /oauth/token issues an opaque bearer token stored in memory for 43200 seconds.
    GET /users/current requires policy user and returns name plus scope. POST /users requires policy server.'
