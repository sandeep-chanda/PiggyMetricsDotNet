- id: STEP-004
  title: P1.T4 Shared typed-client base with 10s timeout and client-credentials cache
  depends_on:
  - STEP-001
  requirement_refs:
  - REQ-P1-T4
  decision_refs:
  - D-004
  evidence_refs:
  - R-004
  files:
  - Shared/Http/TypedClientBase.cs
  - Shared/Http/TypedClientServiceCollectionExtensions.cs
  exact_files:
  - Shared/Http/TypedClientBase.cs
  - Shared/Http/TypedClientServiceCollectionExtensions.cs
  existing_implementation: application.yml hystrix 10000; OAuth2FeignRequestInterceptor client_credentials;
    ExchangeRatesClientFallback pattern for later edges
  creates_file: true
  change: Add ClientCredentialsOptions (AccessTokenUri default http://auth-service:5000/uaa/oauth/token,
    Scope server, TimeoutMilliseconds 10000), ClientCredentialsTokenCache caching access_token by clientId|scope,
    TypedClientBase issuing authorized requests, and AddPiggyTypedClient registering Polly TimeoutAsync
    for the configured milliseconds on both token and typed clients.
  do_not:
  - Change default timeout away from 10000
  - Use password grant inside the typed-client base
  - Omit token cache
  compatibility: Service-specific clients in P3+ inherit TypedClientBase and register their own fallbacks
  error_handling: Token endpoint non-success throws via EnsureSuccessStatusCode; edge fallbacks remain
    per-client in later plans
  tests:
  - dotnet build Shared/Shared.csproj
  acceptance:
  - ClientCredentialsOptions.TimeoutMilliseconds default is 10000
  - AddPiggyTypedClient applies Polly timeout of options.TimeoutMilliseconds
  - Token cache returns cached token when not within 30s of expiry
  rollback: Delete Shared/Http/*
  why: P1.T4 requires typed-client base with source timeout and client-credentials token cache
  expected_result: Shared HTTP helpers provide 10s Polly timeout and cached client_credentials tokens
    for service edges.
  exact_commands:
  - dotnet build Shared/Shared.csproj
  exact_snippet: "namespace PiggyMetrics.Shared.Http;\n\nusing System.Collections.Concurrent;\nusing System.Net.Http.Headers;\n\
    using System.Text;\nusing System.Text.Json;\n\npublic sealed class ClientCredentialsOptions\n{\n \
    \ public string AccessTokenUri { get; set; } = \"http://auth-service:5000/uaa/oauth/token\";\n  public\
    \ string ClientId { get; set; } = string.Empty;\n  public string ClientSecret { get; set; } = string.Empty;\n\
    \  public string Scope { get; set; } = \"server\";\n  public int TimeoutMilliseconds { get; set; }\
    \ = 10000;\n}\n\npublic interface IClientCredentialsTokenCache\n{\n  Task<string> GetTokenAsync(ClientCredentialsOptions\
    \ options, CancellationToken cancellationToken);\n}\n\npublic sealed class ClientCredentialsTokenCache\
    \ : IClientCredentialsTokenCache\n{\n  private readonly IHttpClientFactory _httpClientFactory;\n \
    \ private readonly ConcurrentDictionary<string, (string Token, DateTimeOffset Expires)> _cache = new();\n\
    \n  public ClientCredentialsTokenCache(IHttpClientFactory httpClientFactory)\n  {\n    _httpClientFactory\
    \ = httpClientFactory;\n  }\n\n  public async Task<string> GetTokenAsync(ClientCredentialsOptions\
    \ options, CancellationToken cancellationToken)\n  {\n    var key = options.ClientId + \"|\" + options.Scope;\n\
    \    if (_cache.TryGetValue(key, out var hit) && hit.Expires > DateTimeOffset.UtcNow.AddSeconds(30))\n\
    \    {\n      return hit.Token;\n    }\n\n    var client = _httpClientFactory.CreateClient(\"client-credentials\"\
    );\n    using var content = new FormUrlEncodedContent(new Dictionary<string, string>\n    {\n    \
    \  [\"grant_type\"] = \"client_credentials\",\n      [\"scope\"] = options.Scope,\n    });\n    using\
    \ var request = new HttpRequestMessage(HttpMethod.Post, options.AccessTokenUri) { Content = content\
    \ };\n    var basic = Convert.ToBase64String(Encoding.UTF8.GetBytes(options.ClientId + \":\" + options.ClientSecret));\n\
    \    request.Headers.Authorization = new AuthenticationHeaderValue(\"Basic\", basic);\n    using var\
    \ response = await client.SendAsync(request, cancellationToken);\n    response.EnsureSuccessStatusCode();\n\
    \    await using var stream = await response.Content.ReadAsStreamAsync(cancellationToken);\n    using\
    \ var doc = await JsonDocument.ParseAsync(stream, cancellationToken: cancellationToken);\n    var\
    \ token = doc.RootElement.GetProperty(\"access_token\").GetString()\n      ?? throw new InvalidOperationException(\"\
    access_token missing\");\n    var expiresIn = doc.RootElement.TryGetProperty(\"expires_in\", out var\
    \ exp) ? exp.GetInt32() : 3600;\n    _cache[key] = (token, DateTimeOffset.UtcNow.AddSeconds(expiresIn));\n\
    \    return token;\n  }\n}\n\npublic abstract class TypedClientBase\n{\n  protected TypedClientBase(HttpClient\
    \ httpClient, IClientCredentialsTokenCache tokenCache, ClientCredentialsOptions options)\n  {\n  \
    \  Http = httpClient;\n    TokenCache = tokenCache;\n    Options = options;\n    Http.Timeout = Timeout.InfiniteTimeSpan;\n\
    \  }\n\n  protected HttpClient Http { get; }\n  protected IClientCredentialsTokenCache TokenCache\
    \ { get; }\n  protected ClientCredentialsOptions Options { get; }\n\n  protected async Task<HttpRequestMessage>\
    \ CreateAuthorizedRequestAsync(\n    HttpMethod method,\n    string uri,\n    CancellationToken cancellationToken)\n\
    \  {\n    var token = await TokenCache.GetTokenAsync(Options, cancellationToken);\n    var request\
    \ = new HttpRequestMessage(method, uri);\n    request.Headers.Authorization = new AuthenticationHeaderValue(\"\
    Bearer\", token);\n    return request;\n  }\n}\n"
  exact_companion: "namespace PiggyMetrics.Shared.Http;\n\nusing Microsoft.Extensions.DependencyInjection;\n\
    using Polly;\nusing Polly.Extensions.Http;\n\npublic static class TypedClientServiceCollectionExtensions\n\
    {\n  public static IHttpClientBuilder AddPiggyTypedClient<TClient>(\n    this IServiceCollection services,\n\
    \    string name,\n    ClientCredentialsOptions options,\n    Action<IHttpClientBuilder>? configure\
    \ = null)\n    where TClient : class\n  {\n    services.AddSingleton<IClientCredentialsTokenCache,\
    \ ClientCredentialsTokenCache>();\n    services.AddHttpClient(\"client-credentials\")\n      .AddPolicyHandler(HttpPolicyExtensions\n\
    \        .HandleTransientHttpError()\n        .OrResult(r => false)\n        .WaitAndRetryAsync(0,\
    \ _ => TimeSpan.Zero)\n        .WrapAsync(Policy.TimeoutAsync<HttpResponseMessage>(\n          TimeSpan.FromMilliseconds(options.TimeoutMilliseconds))));\n\
    \n    var builder = services.AddHttpClient<TClient>(name, client =>\n      {\n        client.Timeout\
    \ = Timeout.InfiniteTimeSpan;\n      })\n      .AddPolicyHandler(Policy.TimeoutAsync<HttpResponseMessage>(\n\
    \        TimeSpan.FromMilliseconds(options.TimeoutMilliseconds)));\n    configure?.Invoke(builder);\n\
    \    return builder;\n  }\n}\n"
  companion_required: true
  invariants:
  - TimeoutMilliseconds default 10000
  - grant_type client_credentials
  - HttpClient.Timeout InfiniteTimeSpan with Polly timeout policy
  edge_cases:
  - Missing access_token property throws InvalidOperationException
  machine_verify:
  - dotnet build Shared/Shared.csproj
  human_verify:
  - TypedClientBase and token cache types exist under Shared/Http
- id: STEP-005
  title: P1.T5 Shared health checks and JSON options
  depends_on:
  - STEP-001
  requirement_refs:
  - REQ-P1-T5
  decision_refs:
  - D-005
  evidence_refs:
  - R-003
  files:
  - Shared/Serialization/PiggyJsonOptions.cs
  - Shared/Serialization/PiggyMvcJsonExtensions.cs
  - Shared/Health/PiggyHealthExtensions.cs
  exact_files:
  - Shared/Serialization/PiggyJsonOptions.cs
  - Shared/Serialization/PiggyMvcJsonExtensions.cs
  - Shared/Health/PiggyHealthExtensions.cs
  existing_implementation: Account.java @JsonIgnoreProperties(ignoreUnknown=true); Spring Boot 2 Jackson
    enum names + ISO-8601 dates; actuator health
  creates_file: true
  change: Add PiggyJsonOptions.Create with camelCase naming, case-insensitive properties, JsonStringEnumConverter
    (no integer enums), Iso8601DateTimeConverter format yyyy-MM-dd'T'HH:mm:ss.fffK; System.Text.Json ignores
    unknown fields by default; AddPiggyJsonOptions MVC extension; AddPiggyHealthChecks + MapPiggyHealthChecks
    mapping /health.
  do_not:
  - Enable integer enum reading
  - Use Newtonsoft.Json
  - Map health to a path other than /health
  compatibility: Unknown JSON fields ignored like @JsonIgnoreProperties(ignoreUnknown=true)
  error_handling: Date parse uses RoundtripKind TryParse then GetDateTime fallback
  tests:
  - dotnet build Shared/Shared.csproj
  acceptance:
  - PiggyJsonOptions.Create uses JsonStringEnumConverter
  - MapPiggyHealthChecks maps /health
  - No Newtonsoft PackageReference added
  rollback: Delete Shared/Serialization/* and Shared/Health/*
  why: P1.T5 requires Shared health checks and JSON options matching source enum/date/unknown-field behaviour
  expected_result: Shared exposes health mapping and JSON options services will call in later plans.
  exact_commands:
  - dotnet build Shared/Shared.csproj
  exact_snippet: "namespace PiggyMetrics.Shared.Serialization;\n\nusing System.Text.Json;\nusing System.Text.Json.Serialization;\n\
    \npublic static class PiggyJsonOptions\n{\n  public static JsonSerializerOptions Create()\n  {\n \
    \   var options = new JsonSerializerOptions\n    {\n      PropertyNamingPolicy = JsonNamingPolicy.CamelCase,\n\
    \      PropertyNameCaseInsensitive = true,\n      DefaultIgnoreCondition = JsonIgnoreCondition.Never,\n\
    \      ReadCommentHandling = JsonCommentHandling.Skip,\n      AllowTrailingCommas = false,\n     \
    \ WriteIndented = false,\n    };\n    options.Converters.Add(new JsonStringEnumConverter(JsonNamingPolicy.CamelCase,\
    \ allowIntegerValues: false));\n    options.Converters.Add(new Iso8601DateTimeConverter());\n    return\
    \ options;\n  }\n\n  private sealed class Iso8601DateTimeConverter : JsonConverter<DateTime>\n  {\n\
    \    private const string Format = \"yyyy-MM-dd'T'HH:mm:ss.fffK\";\n\n    public override DateTime\
    \ Read(ref Utf8JsonReader reader, Type typeToConvert, JsonSerializerOptions options)\n    {\n    \
    \  if (reader.TokenType == JsonTokenType.String)\n      {\n        var s = reader.GetString();\n \
    \       if (DateTime.TryParse(s, null, System.Globalization.DateTimeStyles.RoundtripKind, out var\
    \ dt))\n        {\n          return dt;\n        }\n      }\n      return reader.GetDateTime();\n\
    \    }\n\n    public override void Write(Utf8JsonWriter writer, DateTime value, JsonSerializerOptions\
    \ options)\n    {\n      writer.WriteStringValue(value.ToString(Format));\n    }\n  }\n}\n"
  exact_companion: "FILE Shared/Serialization/PiggyMvcJsonExtensions.cs\nnamespace PiggyMetrics.Shared.Serialization;\n\
    \nusing Microsoft.Extensions.DependencyInjection;\n\npublic static class PiggyMvcJsonExtensions\n\
    {\n  public static IMvcBuilder AddPiggyJsonOptions(this IMvcBuilder mvc)\n  {\n    return mvc.AddJsonOptions(o\
    \ =>\n    {\n      var shared = PiggyJsonOptions.Create();\n      o.JsonSerializerOptions.PropertyNamingPolicy\
    \ = shared.PropertyNamingPolicy;\n      o.JsonSerializerOptions.PropertyNameCaseInsensitive = shared.PropertyNameCaseInsensitive;\n\
    \      o.JsonSerializerOptions.DefaultIgnoreCondition = shared.DefaultIgnoreCondition;\n      o.JsonSerializerOptions.Converters.Clear();\n\
    \      foreach (var c in shared.Converters)\n      {\n        o.JsonSerializerOptions.Converters.Add(c);\n\
    \      }\n    });\n  }\n}\n\nFILE Shared/Health/PiggyHealthExtensions.cs\nnamespace PiggyMetrics.Shared.Health;\n\
    \nusing Microsoft.AspNetCore.Builder;\nusing Microsoft.Extensions.DependencyInjection;\n\npublic static\
    \ class PiggyHealthExtensions\n{\n  public static IServiceCollection AddPiggyHealthChecks(this IServiceCollection\
    \ services)\n  {\n    services.AddHealthChecks();\n    return services;\n  }\n\n  public static WebApplication\
    \ MapPiggyHealthChecks(this WebApplication app)\n  {\n    app.MapHealthChecks(\"/health\");\n    return\
    \ app;\n  }\n}\n"
  companion_required: true
  invariants:
  - Enums serialized as names
  - Unknown fields ignored
  - Health path /health
  edge_cases:
  - DateTime converter accepts RoundtripKind strings
  machine_verify:
  - dotnet build Shared/Shared.csproj
  human_verify:
  - PiggyHealthExtensions and PiggyJsonOptions types present
