    \    }\n    var client = clients.FirstOrDefault(item => item.Id == id);\n    if (client == null)\n    {\n      return\
    \ (null, 401);\n    }\n    if (client.Secret.Length > 0 && client.Secret != secret)\n    {\n      return (null, 401);\n\
    \    }\n    return (client, 200);\n  }\n}\n"
