  machine_verify:
  - dotnet test Shared.Tests/Shared.Tests.csproj --filter FullyQualifiedName~UserInfoBearerHandlerTests
  human_verify:
  - Two test methods named Accepts_* and Refuses_* exist
- id: STEP-003
  title: P1.T3 Shared MongoDB store conventions and document serializers
  depends_on:
  - STEP-001
  requirement_refs:
  - REQ-P1-T3
  decision_refs:
  - D-003
  evidence_refs:
  - R-003
  files:
  - Shared/Store/PiggyMongoConventions.cs
  - Shared/Store/AccountDocument.cs
  - Shared/Store/DataPointDocument.cs
  - Shared/Store/UserDocument.cs
  exact_files:
  - Shared/Store/PiggyMongoConventions.cs
  - Shared/Store/AccountDocument.cs
  - Shared/Store/DataPointDocument.cs
  - Shared/Store/UserDocument.cs
  existing_implementation: Account.java @Document accounts @Id name; DataPoint.java datapoints; User.java
    username/_id
  creates_file: true
  change: Add PiggyMongoConventions.Register with CamelCaseElementNameConvention, IgnoreExtraElementsConvention(true),
    EnumRepresentationConvention(String), constants for database piggymetrics and collections accounts/datapoints/users;
    add AccountDocument/DataPointDocument/UserDocument with BsonId and BsonElement names matching Java
    field names and _id semantics.
  do_not:
  - Rename BSON fields to PascalCase in storage
  - Use collection names other than accounts, datapoints, users
  - Introduce EF Core Mongo provider
  compatibility: Existing Java-written Mongo documents remain readable
  error_handling: Register is idempotent via Interlocked flag
  tests:
  - dotnet build Shared/Shared.csproj
  acceptance:
  - PiggyMongoConventions.AccountsCollection == accounts
  - AccountDocument.Name is BsonId
  - DataPointDocument.Id is DataPointIdDocument with account+date elements
  - UserDocument uses username as BsonId
  rollback: Delete Shared/Store/*
  why: P1.T3 requires Shared store conventions for document field names and ids on MongoDB.Driver
  expected_result: Shared.Store serializes accounts/datapoints/users with the same BSON shape as the Java
    services.
  exact_commands:
  - dotnet build Shared/Shared.csproj
  exact_snippet: "namespace PiggyMetrics.Shared.Store;\n\nusing MongoDB.Bson;\nusing MongoDB.Bson.Serialization.Conventions;\n\
    \npublic static class PiggyMongoConventions\n{\n  public const string RegistryName = \"piggymetrics\"\
    ;\n  public const string AccountsCollection = \"accounts\";\n  public const string DatapointsCollection\
    \ = \"datapoints\";\n  public const string UsersCollection = \"users\";\n  public const string DatabaseName\
    \ = \"piggymetrics\";\n\n  private static int _registered;\n\n  public static void Register()\n  {\n\
    \    if (Interlocked.Exchange(ref _registered, 1) == 1)\n    {\n      return;\n    }\n\n    var pack\
    \ = new ConventionPack\n    {\n      new CamelCaseElementNameConvention(),\n      new IgnoreExtraElementsConvention(true),\n\
    \      new EnumRepresentationConvention(BsonType.String),\n    };\n    ConventionRegistry.Register(RegistryName,\
    \ pack, _ => true);\n  }\n}\n"
  exact_companion: "FILE Shared/Store/AccountDocument.cs\nnamespace PiggyMetrics.Shared.Store;\n\nusing\
    \ MongoDB.Bson;\nusing MongoDB.Bson.Serialization.Attributes;\n\n[BsonIgnoreExtraElements]\npublic\
    \ sealed class AccountDocument\n{\n  [BsonId]\n  public string Name { get; set; } = string.Empty;\n\
    \n  [BsonElement(\"lastSeen\")]\n  public DateTime? LastSeen { get; set; }\n\n  [BsonElement(\"incomes\"\
