- id: STEP-003
  title: Add the shared bearer handler that calls auth-service
  depends_on:
  - STEP-002
  requirement_refs:
  - REQ-003
  decision_refs:
  - D-004
  evidence_refs:
  - R-004
  files: &id005
  - src/Shared/Auth/AuthServiceBearerHandler.cs
  - tests/Shared.Tests/Shared.Tests.csproj
