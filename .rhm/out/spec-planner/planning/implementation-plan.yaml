- id: STEP-002
  title: P1.T2 Shared UserInfoBearerHandler validating via auth-service user-info
  depends_on:
  - STEP-001
  requirement_refs:
  - REQ-P1-T2
  - REQ-P1-DONE
  decision_refs:
  - D-002
  evidence_refs:
  - R-002
  files:
  - Shared/Security/UserInfoBearerOptions.cs
  - Shared/Security/UserInfoBearerHandler.cs
  - Shared/Security/UserInfoBearerExtensions.cs
  - Shared.Tests/Security/UserInfoBearerHandlerTests.cs
  exact_files:
  - Shared/Security/UserInfoBearerOptions.cs
  - Shared/Security/UserInfoBearerHandler.cs
  - Shared/Security/UserInfoBearerExtensions.cs
  - Shared.Tests/Security/UserInfoBearerHandlerTests.cs
  existing_implementation: account-service CustomUserInfoTokenServices.java + ResourceServerConfig.java
    + application.yml user-info-uri
  creates_file: true
  change: Add UserInfoBearerOptions defaulting UserInfoEndpoint to http://auth-service:5000/uaa/users/current,
    UserInfoBearerHandler that forwards Authorization Bearer to that URI and succeeds only when HTTP success
    and JSON lacks error (principal from user/username/userid/user_id/login/id/name; scopes/client_id
    from oauth2Request), AddUserInfoBearer extension registering HttpClient userinfo, and xunit tests
    proving issued token accepted and unissued token refused.
  do_not:
  - Validate JWT signatures locally instead of user-info
  - Change UserInfoEndpoint default away from http://auth-service:5000/uaa/users/current
  - Skip refuse-path test
  compatibility: Matches CustomUserInfoTokenServices error-map and principal key order
  error_handling: HTTP/parse failures return AuthenticateResult.Fail like source catch returning error
    map
  tests:
  - UserInfoBearerHandlerTests.Accepts_token_authorization_server_issued
  - UserInfoBearerHandlerTests.Refuses_token_authorization_server_did_not_issue
  acceptance:
  - dotnet test --filter UserInfoBearerHandlerTests succeeds
  - Accept test returns 200 with principal name demo for issued token stub
  - Refuse test returns 401 for forged token stub
  rollback: Delete Shared/Security/* and Shared.Tests/Security/*
  why: P1.T2 and Done-when require Shared bearer to accept authorization-server-issued tokens and refuse
    others
  expected_result: Shared authentication handler mirrors Java resource-server user-info validation with
    green accept/refuse tests.
  exact_commands:
  - dotnet test Shared.Tests/Shared.Tests.csproj --filter FullyQualifiedName~UserInfoBearerHandlerTests
  exact_snippet: "namespace PiggyMetrics.Shared.Security;\n\nusing System.Net.Http.Headers;\nusing System.Security.Claims;\n\
    using System.Text.Json;\nusing Microsoft.AspNetCore.Authentication;\nusing Microsoft.Extensions.Logging;\n\
    using Microsoft.Extensions.Options;\n\npublic sealed class UserInfoBearerHandler : AuthenticationHandler<UserInfoBearerOptions>\n\
    {\n  private static readonly string[] PrincipalKeys =\n  {\n    \"user\", \"username\", \"userid\"\
    , \"user_id\", \"login\", \"id\", \"name\"\n  };\n\n  private readonly IHttpClientFactory _httpClientFactory;\n\
    \n  public UserInfoBearerHandler(\n    IOptionsMonitor<UserInfoBearerOptions> options,\n    ILoggerFactory\
    \ logger,\n    System.Text.Encodings.Web.UrlEncoder encoder,\n    IHttpClientFactory httpClientFactory)\n\
    \    : base(options, logger, encoder)\n  {\n    _httpClientFactory = httpClientFactory;\n  }\n\n \
    \ protected override async Task<AuthenticateResult> HandleAuthenticateAsync()\n  {\n    if (!Request.Headers.TryGetValue(\"\
    Authorization\", out var headerValues))\n    {\n      return AuthenticateResult.NoResult();\n    }\n\
    \n    var header = headerValues.ToString();\n    if (string.IsNullOrWhiteSpace(header) ||\n      \
    \  !header.StartsWith(\"Bearer \", StringComparison.OrdinalIgnoreCase))\n    {\n      return AuthenticateResult.NoResult();\n\
    \    }\n\n    var accessToken = header[\"Bearer \".Length..].Trim();\n    if (string.IsNullOrEmpty(accessToken))\n\
    \    {\n      return AuthenticateResult.Fail(\"Missing bearer token\");\n    }\n\n    try\n    {\n\
    \      var client = _httpClientFactory.CreateClient(\"userinfo\");\n      using var request = new\
    \ HttpRequestMessage(HttpMethod.Get, Options.UserInfoEndpoint);\n      request.Headers.Authorization\
    \ = new AuthenticationHeaderValue(\"Bearer\", accessToken);\n      using var response = await client.SendAsync(request,\
    \ Context.RequestAborted);\n      var body = await response.Content.ReadAsStringAsync(Context.RequestAborted);\n\
    \      using var doc = JsonDocument.Parse(string.IsNullOrWhiteSpace(body) ? \"{}\" : body);\n    \
    \  var root = doc.RootElement;\n      if (!response.IsSuccessStatusCode || root.TryGetProperty(\"\
    error\", out _))\n      {\n        return AuthenticateResult.Fail(\"Token rejected by authorization\
    \ server\");\n      }\n\n      var principalName = \"unknown\";\n      foreach (var key in PrincipalKeys)\n\
    \      {\n        if (root.TryGetProperty(key, out var p) && p.ValueKind == JsonValueKind.String)\n\
    \        {\n          principalName = p.GetString() ?? \"unknown\";\n          break;\n        }\n\
    \      }\n\n      var claims = new List<Claim> { new Claim(ClaimTypes.Name, principalName) };\n  \
    \    if (root.TryGetProperty(\"oauth2Request\", out var oauth2) &&\n          oauth2.ValueKind ==\
    \ JsonValueKind.Object)\n      {\n        if (oauth2.TryGetProperty(\"clientId\", out var clientId)\
    \ &&\n            clientId.ValueKind == JsonValueKind.String)\n        {\n          claims.Add(new\
    \ Claim(\"client_id\", clientId.GetString() ?? string.Empty));\n        }\n        if (oauth2.TryGetProperty(\"\
    scope\", out var scopeEl))\n        {\n          if (scopeEl.ValueKind == JsonValueKind.Array)\n \
    \         {\n            foreach (var s in scopeEl.EnumerateArray())\n            {\n            \
    \  if (s.ValueKind == JsonValueKind.String)\n              {\n                claims.Add(new Claim(\"\
    scope\", s.GetString() ?? string.Empty));\n              }\n            }\n          }\n         \
    \ else if (scopeEl.ValueKind == JsonValueKind.String)\n          {\n            foreach (var s in\
    \ (scopeEl.GetString() ?? string.Empty).Split(' ', StringSplitOptions.RemoveEmptyEntries))\n     \
    \       {\n              claims.Add(new Claim(\"scope\", s));\n            }\n          }\n      \
    \  }\n      }\n\n      var identity = new ClaimsIdentity(claims, Scheme.Name);\n      var ticket =\
    \ new AuthenticationTicket(new ClaimsPrincipal(identity), Scheme.Name);\n      return AuthenticateResult.Success(ticket);\n\
    \    }\n    catch (Exception ex)\n    {\n      Logger.LogInformation(ex, \"Could not fetch user details\
    \ from {Endpoint}\", Options.UserInfoEndpoint);\n      return AuthenticateResult.Fail(\"Could not\
    \ fetch user details\");\n    }\n  }\n}\n"
  exact_companion: "FILE Shared/Security/UserInfoBearerOptions.cs\nnamespace PiggyMetrics.Shared.Security;\n\
    \npublic sealed class UserInfoBearerOptions\n{\n  public const string DefaultScheme = \"Bearer\";\n\
    \  public string UserInfoEndpoint { get; set; } = \"http://auth-service:5000/uaa/users/current\";\n\
    \  public string ChallengeScheme { get; set; } = DefaultScheme;\n}\n\nFILE Shared/Security/UserInfoBearerExtensions.cs\n\
    namespace PiggyMetrics.Shared.Security;\n\nusing Microsoft.AspNetCore.Authentication;\nusing Microsoft.Extensions.DependencyInjection;\n\
    \npublic static class UserInfoBearerExtensions\n{\n  public static AuthenticationBuilder AddUserInfoBearer(\n\
    \    this AuthenticationBuilder builder,\n    Action<UserInfoBearerOptions>? configure = null)\n \
    \ {\n    builder.Services.AddHttpClient(\"userinfo\");\n    return builder.AddScheme<UserInfoBearerOptions,\
    \ UserInfoBearerHandler>(\n      UserInfoBearerOptions.DefaultScheme,\n      configure);\n  }\n}\n\
    \nFILE Shared.Tests/Security/UserInfoBearerHandlerTests.cs\nnamespace PiggyMetrics.Shared.Tests.Security;\n\
    \nusing System.Net;\nusing System.Net.Http.Headers;\nusing System.Text;\nusing System.Text.Json;\n\
    using Microsoft.AspNetCore.Authentication;\nusing Microsoft.AspNetCore.Builder;\nusing Microsoft.AspNetCore.Hosting;\n\
    using Microsoft.AspNetCore.Http;\nusing Microsoft.AspNetCore.TestHost;\nusing Microsoft.Extensions.DependencyInjection;\n\
    using PiggyMetrics.Shared.Security;\nusing Xunit;\n\npublic sealed class UserInfoBearerHandlerTests\n\
    {\n  [Fact]\n  public async Task Accepts_token_authorization_server_issued()\n  {\n    var userInfo\
    \ = JsonSerializer.Serialize(new\n    {\n      name = \"demo\",\n      oauth2Request = new { clientId\
    \ = \"browser\", scope = new[] { \"ui\" } }\n    });\n    using var host = CreateHost(_ => new HttpResponseMessage(HttpStatusCode.OK)\n\
    \    {\n      Content = new StringContent(userInfo, Encoding.UTF8, \"application/json\")\n    });\n\
    \    var client = host.GetTestClient();\n    client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue(\"\
    Bearer\", \"issued-token\");\n    var response = await client.GetAsync(\"/secure\");\n    Assert.Equal(HttpStatusCode.OK,\
    \ response.StatusCode);\n    Assert.Equal(\"demo\", await response.Content.ReadAsStringAsync());\n\
    \  }\n\n  [Fact]\n  public async Task Refuses_token_authorization_server_did_not_issue()\n  {\n  \
    \  using var host = CreateHost(_ => new HttpResponseMessage(HttpStatusCode.Unauthorized)\n    {\n\
    \      Content = new StringContent(\"{\"error\":\"invalid_token\"}\", Encoding.UTF8, \"application/json\"\
    )\n    });\n    var client = host.GetTestClient();\n    client.DefaultRequestHeaders.Authorization\
    \ = new AuthenticationHeaderValue(\"Bearer\", \"forged-token\");\n    var response = await client.GetAsync(\"\
    /secure\");\n    Assert.Equal(HttpStatusCode.Unauthorized, response.StatusCode);\n  }\n\n  private\
    \ static TestServer CreateHost(Func<HttpRequestMessage, HttpResponseMessage> userInfo)\n  {\n    var\
    \ builder = new WebHostBuilder()\n      .ConfigureServices(services =>\n      {\n        services.AddRouting();\n\
    \        services.AddAuthentication(UserInfoBearerOptions.DefaultScheme)\n          .AddUserInfoBearer(o\
    \ => o.UserInfoEndpoint = \"http://auth-service:5000/uaa/users/current\");\n        services.AddAuthorization();\n\
    \        services.AddHttpClient(\"userinfo\")\n          .ConfigurePrimaryHttpMessageHandler(() =>\
    \ new StubHandler(userInfo));\n      })\n      .Configure(app =>\n      {\n        app.UseRouting();\n\
    \        app.UseAuthentication();\n        app.UseAuthorization();\n        app.UseEndpoints(endpoints\
    \ =>\n        {\n          endpoints.MapGet(\"/secure\", async (HttpContext ctx) =>\n          {\n\
    \            var result = await ctx.AuthenticateAsync(UserInfoBearerOptions.DefaultScheme);\n    \
    \        if (!result.Succeeded)\n            {\n              ctx.Response.StatusCode = StatusCodes.Status401Unauthorized;\n\
    \              return;\n            }\n            await ctx.Response.WriteAsync(result.Principal!.Identity!.Name\
    \ ?? string.Empty);\n          });\n        });\n      });\n    return new TestServer(builder);\n\
    \  }\n\n  private sealed class StubHandler : HttpMessageHandler\n  {\n    private readonly Func<HttpRequestMessage,\
    \ HttpResponseMessage> _impl;\n    public StubHandler(Func<HttpRequestMessage, HttpResponseMessage>\
    \ impl) => _impl = impl;\n    protected override Task<HttpResponseMessage> SendAsync(HttpRequestMessage\
    \ request, CancellationToken cancellationToken)\n      => Task.FromResult(_impl(request));\n  }\n\
    }\n"
  companion_required: true
  invariants:
  - Default UserInfoEndpoint is http://auth-service:5000/uaa/users/current
