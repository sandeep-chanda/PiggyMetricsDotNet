  exact_files: *id005
  existing_implementation: README.md:1 records Sample .NET Migration and the tree has no csproj. Cited Java sources are external
    evidence, absent from this checkout.
  creates_file: true
  change: Add AuthServiceBearerHandler. It forwards the inbound Authorization header to Piggy:Auth:UserInfoUrl, default http://auth-service:5000/uaa/users/current.
    HTTP 200 with a name claim succeeds. Any other status refuses the token. Register policies user and server.
  do_not:
  - Do not edit README.md, AGENTS.md, .harnessmatters, or .rhm/agent-packs.
  - Do not add AccountService business endpoints, NotificationService mail jobs, or Gateway route tables in this package.
  - Do not switch the target framework away from net10.0.
  compatibility: Mongo field names stay the Java document names. HTTP paths stay the source paths.
  error_handling: Missing bearer yields 401. Authenticated caller without the server scope yields 403. Down rates callee returns
    the fallback container.
  tests:
  - accepts_a_token_the_authorization_server_issued
  - refuses_a_token_the_authorization_server_did_not_issue
  acceptance: &id006
  - accepts_a_token_the_authorization_server_issued passes.
  - refuses_a_token_the_authorization_server_did_not_issue passes.
  rollback: Delete the exact_files created by this step and remove their Project entries from PiggyMetrics.sln.
  why: The intake spec maps this behavior onto the empty PiggyMetricsDotNet tree and the cited Java sources.
  expected_result: accepts_a_token_the_authorization_server_issued passes.
  exact_commands:
  - dotnet build PiggyMetrics.sln --nologo
  - dotnet test PiggyMetrics.sln --nologo
  exact_snippet: "// FILE: src/Shared/Auth/AuthServiceBearerHandler.cs\nusing System.Security.Claims;\nusing System.Text.Encodings.Web;\n\
    using System.Text.Json;\nusing Microsoft.AspNetCore.Authentication;\nusing Microsoft.Extensions.Configuration;\nusing\
    \ Microsoft.Extensions.DependencyInjection;\nusing Microsoft.Extensions.Logging;\nusing Microsoft.Extensions.Options;\n\
    \nnamespace PiggyMetrics.Shared.Auth;\n\npublic sealed class AuthServiceBearerHandler : AuthenticationHandler<AuthenticationSchemeOptions>\n\
    {\n  public const string SchemeName = \"PiggyBearer\";\n  private readonly IHttpClientFactory _clients;\n\n  public AuthServiceBearerHandler(\n\
    \    IOptionsMonitor<AuthenticationSchemeOptions> options,\n    ILoggerFactory logger,\n    UrlEncoder encoder,\n    IHttpClientFactory\
    \ clients)\n    : base(options, logger, encoder)\n  {\n    _clients = clients;\n  }\n\n  protected override async Task<AuthenticateResult>\
    \ HandleAuthenticateAsync()\n  {\n    var header = Request.Headers.Authorization.ToString();\n    if (string.IsNullOrEmpty(header)\
    \ || !header.StartsWith(\"Bearer \", StringComparison.Ordinal))\n    {\n      return AuthenticateResult.NoResult();\n\
    \    }\n\n    var userInfoUrl = Context.RequestServices\n      .GetRequiredService<IOptions<PiggyAuthOptions>>().Value.UserInfoUrl;\n\
    \    var client = _clients.CreateClient(\"auth-userinfo\");\n    var request = new HttpRequestMessage(HttpMethod.Get,\
    \ userInfoUrl);\n    request.Headers.TryAddWithoutValidation(\"Authorization\", header);\n    HttpResponseMessage response;\n\
    \    try\n    {\n      response = await client.SendAsync(request, Context.RequestAborted);\n    }\n    catch (HttpRequestException\
    \ ex)\n    {\n      return AuthenticateResult.Fail(ex.Message);\n    }\n\n    if (!response.IsSuccessStatusCode)\n   \
    \ {\n      return AuthenticateResult.Fail(\"token refused\");\n    }\n\n    await using var stream = await response.Content.ReadAsStreamAsync(Context.RequestAborted);\n\
    \    using var document = await JsonDocument.ParseAsync(stream, cancellationToken: Context.RequestAborted);\n    if (!document.RootElement.TryGetProperty(\"\
    name\", out var nameNode))\n    {\n      return AuthenticateResult.Fail(\"token refused\");\n    }\n    var name = nameNode.GetString();\n\
    \    if (string.IsNullOrEmpty(name))\n    {\n      return AuthenticateResult.Fail(\"token refused\");\n    }\n    var\
    \ scope = document.RootElement.TryGetProperty(\"scope\", out var scopeNode)\n      ? scopeNode.GetString() ?? \"\"\n \
    \     : \"\";\n    var claims = new List<Claim>\n    {\n      new(ClaimTypes.Name, name),\n      new(\"scope\", scope)\n\
    \    };\n    var identity = new ClaimsIdentity(claims, SchemeName);\n    var ticket = new AuthenticationTicket(new ClaimsPrincipal(identity),\
    \ SchemeName);\n    return AuthenticateResult.Success(ticket);\n  }\n}\n\npublic sealed class PiggyAuthOptions\n{\n  public\
    \ string UserInfoUrl { get; set; } = \"http://auth-service:5000/uaa/users/current\";\n  public string TokenUrl { get;\
    \ set; } = \"http://auth-service:5000/uaa/oauth/token\";\n}\n\npublic static class PiggyAuthenticationExtensions\n{\n\
    \  public static IServiceCollection AddPiggyBearer(this IServiceCollection services, IConfiguration configuration)\n \
    \ {\n    services.Configure<PiggyAuthOptions>(configuration.GetSection(\"Piggy:Auth\"));\n    services.AddHttpClient(\"\
    auth-userinfo\");\n    services.AddAuthentication(AuthServiceBearerHandler.SchemeName)\n      .AddScheme<AuthenticationSchemeOptions,\
    \ AuthServiceBearerHandler>(AuthServiceBearerHandler.SchemeName, null);\n    services.AddAuthorization(options =>\n  \
    \  {\n      options.AddPolicy(\"user\", policy => policy.RequireAuthenticatedUser());\n      options.AddPolicy(\"server\"\
    , policy => policy.RequireAssertion(context =>\n      {\n        var scope = context.User.FindFirst(\"scope\")?.Value\
    \ ?? \"\";\n        return scope.Split(' ', StringSplitOptions.RemoveEmptyEntries).Contains(\"server\");\n      }));\n\
    \    });\n    return services;\n  }\n}\n\n// FILE: tests/Shared.Tests/Shared.Tests.csproj\n<Project Sdk=\"Microsoft.NET.Sdk\"\
    >\n  <PropertyGroup>\n    <RootNamespace>PiggyMetrics.Shared.Tests</RootNamespace>\n    <AssemblyName>PiggyMetrics.Shared.Tests</AssemblyName>\n\
    \    <IsPackable>false</IsPackable>\n  </PropertyGroup>\n  <ItemGroup>\n    <FrameworkReference Include=\"Microsoft.AspNetCore.App\"\
    \ />\n    <PackageReference Include=\"Microsoft.NET.Test.Sdk\" Version=\"18.11.0\" />\n    <PackageReference Include=\"\
    xunit\" Version=\"2.9.3\" />\n    <PackageReference Include=\"xunit.runner.visualstudio\" Version=\"2.8.2\" />\n    <PackageReference\
    \ Include=\"Microsoft.AspNetCore.Mvc.Testing\" Version=\"10.0.13\" />\n    <PackageReference Include=\"Mongo2Go\" Version=\"\
    3.1.3\" />\n  </ItemGroup>\n  <ItemGroup>\n    <ProjectReference Include=\"..\\..\\src\\Shared\\Shared.csproj\" />\n \
    \ </ItemGroup>\n</Project>\n\n// FILE: tests/Shared.Tests/BearerHandlerTests.cs\nusing System.Net;\nusing System.Text;\n\
    using Microsoft.AspNetCore.Builder;\nusing Microsoft.AspNetCore.Hosting;\nusing Microsoft.AspNetCore.Hosting.Server;\n\
    using Microsoft.AspNetCore.Hosting.Server.Features;\nusing Microsoft.AspNetCore.Http;\nusing Microsoft.Extensions.DependencyInjection;\n\
    using PiggyMetrics.Shared.Auth;\n\nnamespace PiggyMetrics.Shared.Tests;\n\npublic class BearerHandlerTests\n{\n  [Fact]\n\
    \  public async Task accepts_a_token_the_authorization_server_issued()\n  {\n    await using var auth = await AuthStub.Start(HttpStatusCode.OK,\
    \ \"{\\\"name\\\":\\\"demo\\\",\\\"scope\\\":\\\"ui\\\"}\");\n    await using var app = await ResourceStub.Start(auth.Url);\n\
    \    using var client = new HttpClient();\n    var request = new HttpRequestMessage(HttpMethod.Get, app.Url + \"/probe\"\
    );\n    request.Headers.TryAddWithoutValidation(\"Authorization\", \"Bearer issued-token\");\n    var response = await\
    \ client.SendAsync(request);\n    Assert.Equal(HttpStatusCode.OK, response.StatusCode);\n    Assert.Equal(\"demo\", await\
