- id: STEP-002
  title: Add shared JSON options and actuator health
  depends_on:
  - STEP-001
  requirement_refs:
  - REQ-002
  decision_refs:
  - D-003
  evidence_refs:
  - R-003
  files: &id003
  - src/Shared/Json/PiggyJson.cs
  - src/Shared/Health/PiggyHealthExtensions.cs
  exact_files: *id003
  existing_implementation: README.md:1 records Sample .NET Migration and the tree has no csproj. Cited Java sources are external
    evidence, absent from this checkout.
  creates_file: true
  change: Add PiggyJson with camelCase names, string enums, skipped unknown members, and Jackson 2.9 date text yyyy-MM-ddTHH:mm:ss.fff
    plus a numeric zone without a colon. Map GET /actuator/health to the body {"status":"UP"}.
  do_not:
  - Do not edit README.md, AGENTS.md, .harnessmatters, or .rhm/agent-packs.
  - Do not add AccountService business endpoints, NotificationService mail jobs, or Gateway route tables in this package.
  - Do not switch the target framework away from net10.0.
  compatibility: Mongo field names stay the Java document names. HTTP paths stay the source paths.
  error_handling: Missing bearer yields 401. Authenticated caller without the server scope yields 403. Down rates callee returns
    the fallback container.
  tests:
  - BearerHandlerTests
  acceptance: &id004
  - GET /actuator/health returns 200 and the body {"status":"UP"}.
  - Enum values serialize as their names.
  rollback: Delete the exact_files created by this step and remove their Project entries from PiggyMetrics.sln.
  why: The intake spec maps this behavior onto the empty PiggyMetricsDotNet tree and the cited Java sources.
  expected_result: GET /actuator/health returns 200 and the body {"status":"UP"}.
  exact_commands:
  - dotnet build PiggyMetrics.sln --nologo
  - dotnet test PiggyMetrics.sln --nologo
  exact_snippet: "// FILE: src/Shared/Json/PiggyJson.cs\nusing System.Globalization;\nusing System.Text.Json;\nusing System.Text.Json.Serialization;\n\
    \nnamespace PiggyMetrics.Shared.Json;\n\npublic static class PiggyJson\n{\n  public static JsonSerializerOptions Options\
    \ { get; } = Create();\n\n  public static JsonSerializerOptions Create()\n  {\n    var options = new JsonSerializerOptions\n\
    \    {\n      PropertyNamingPolicy = JsonNamingPolicy.CamelCase,\n      PropertyNameCaseInsensitive = true,\n      DefaultIgnoreCondition\
    \ = JsonIgnoreCondition.Never,\n      UnmappedMemberHandling = JsonUnmappedMemberHandling.Skip,\n      NumberHandling\
    \ = JsonNumberHandling.AllowReadingFromString\n    };\n    options.Converters.Add(new JsonStringEnumConverter(null, allowIntegerValues:\
    \ false));\n    options.Converters.Add(new JacksonDateTimeConverter());\n    options.Converters.Add(new JacksonDateOnlyConverter());\n\
    \    return options;\n  }\n\n  public static string FormatJacksonDate(DateTimeOffset value)\n  {\n    var utc = value.ToUniversalTime();\n\
    \    var stamp = utc.ToString(\"yyyy-MM-dd'T'HH:mm:ss.fff\", CultureInfo.InvariantCulture);\n    var zone = utc.ToString(\"\
    zzz\", CultureInfo.InvariantCulture).Replace(\":\", \"\");\n    return stamp + zone;\n  }\n}\n\npublic sealed class JacksonDateTimeConverter\
    \ : JsonConverter<DateTime>\n{\n  public override DateTime Read(ref Utf8JsonReader reader, Type typeToConvert, JsonSerializerOptions\
    \ options)\n  {\n    var text = reader.GetString() ?? throw new JsonException(\"date is missing\");\n    if (text.Length\
    \ > 5 && (text[^5] == '+' || text[^5] == '-') && text[^3] != ':')\n    {\n      text = text[..^2] + \":\" + text[^2..];\n\
    \    }\n    return DateTime.Parse(text, CultureInfo.InvariantCulture, DateTimeStyles.RoundtripKind);\n  }\n\n  public\
    \ override void Write(Utf8JsonWriter writer, DateTime value, JsonSerializerOptions options)\n  {\n    var offset = value.Kind\
    \ == DateTimeKind.Unspecified\n      ? new DateTimeOffset(DateTime.SpecifyKind(value, DateTimeKind.Local))\n      : new\
    \ DateTimeOffset(value);\n    writer.WriteStringValue(PiggyJson.FormatJacksonDate(offset));\n  }\n}\n\npublic sealed class\
    \ JacksonDateOnlyConverter : JsonConverter<DateOnly>\n{\n  public override DateOnly Read(ref Utf8JsonReader reader, Type\
    \ typeToConvert, JsonSerializerOptions options)\n  {\n    var text = reader.GetString() ?? throw new JsonException(\"\
    date is missing\");\n    return DateOnly.Parse(text, CultureInfo.InvariantCulture);\n  }\n\n  public override void Write(Utf8JsonWriter\
    \ writer, DateOnly value, JsonSerializerOptions options)\n  {\n    writer.WriteStringValue(value.ToString(\"yyyy-MM-dd\"\
    , CultureInfo.InvariantCulture));\n  }\n}\n\n// FILE: src/Shared/Health/PiggyHealthExtensions.cs\nusing Microsoft.AspNetCore.Builder;\n\
    using Microsoft.AspNetCore.Http;\nusing Microsoft.Extensions.DependencyInjection;\n\nnamespace PiggyMetrics.Shared.Health;\n\
    \npublic static class PiggyHealthExtensions\n{\n  public const string Path = \"/actuator/health\";\n  public const string\
    \ Body = \"{\\\"status\\\":\\\"UP\\\"}\";\n\n  public static IServiceCollection AddPiggyHealth(this IServiceCollection\
    \ services)\n  {\n    services.AddHealthChecks();\n    return services;\n  }\n\n  public static WebApplication MapPiggyHealth(this\
    \ WebApplication app)\n  {\n    app.MapGet(Path, () => Results.Text(Body, \"application/json\"));\n    return app;\n \
    \ }\n}\n"
  companion_required: false
  invariants:
  - Unknown JSON members do not fail deserialization.
  - Date text uses the Jackson zone form.
  edge_cases:
  - A date with a colon in the zone is accepted on read.
