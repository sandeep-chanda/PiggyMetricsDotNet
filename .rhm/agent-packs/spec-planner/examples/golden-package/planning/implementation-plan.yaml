      Add build_customers_pipeline() returning IncrementalPipeline configured
      with watermark and extract_customers.
    do_not:
      - Implement custom watermark storage outside IncrementalPipeline
      - Change orders/payments pipelines
    compatibility: Orders and payments pipelines unchanged
    error_handling: Retain IncrementalPipeline.run behaviour
    tests:
      - Empty result test
      - API failure test
    acceptance:
      - build_customers_pipeline uses IncrementalPipeline
      - Existing orders/payments still importable
    rollback: Revert customer pipeline function
