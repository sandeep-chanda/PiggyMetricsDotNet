    title: Add customer extract helper using CustomerClient.fetch
    depends_on: []
    requirement_refs: [REQ-001, REQ-003]
    decision_refs: [D-001]
    evidence_refs: [R-001]
    files:
      - src/customers.py
    existing_implementation: "src/payments.py:1-12"
    change: >
      Create extract_customers(watermark) that calls CustomerClient.fetch for
      incremental batch semantics consistent with payments extract style.
    do_not:
      - Modify CustomerClient authentication
      - Introduce a new HTTP client
    compatibility: CustomerClient.fetch return shape unchanged
    error_handling: Propagate fetch exceptions to caller tests
    tests:
